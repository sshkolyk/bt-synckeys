name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.7"
            runner: ubuntu-22.04
          - python-version: "3.8"
            runner: ubuntu-latest
          - python-version: "3.9"
            runner: ubuntu-latest
          - python-version: "3.10"
            runner: ubuntu-latest
          - python-version: "3.11"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
          - python-version: "3.13"
            runner: ubuntu-latest
          - python-version: "3.14"
            runner: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile bt-synckeys.py

      - name: Import module
        run: python -c "import importlib.util; spec = importlib.util.spec_from_file_location('bt_synckeys', 'bt-synckeys.py'); module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)"

      - name: Run CLI help
        run: python bt-synckeys.py --help
